<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ojas Ji ka Bday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sevillana&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: 'Sevillana', cursive;
      font-weight: bold;
      color: #d32f2f;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    h1 {
      font-size: 5rem;
      animation: bounce 2s infinite;
    }

    p {
      font-size: 3rem;
      margin-top: 20px;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-30px);
      }
      60% {
        transform: translateY(-15px);
      }
    }

    /* Floating Hearts Animation */
    .heart, .kiss {
      position: absolute;
      color: #ff6f61;
      font-size: 2rem;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    .heart {
      bottom: -10%;
      animation-name: floatUp;
    }

    .kiss {
      top: -10%;
      animation-name: floatDown;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes floatDown {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div>
    <h1>🎉 Happy Birthday Non-Mehraa! 🎂</h1>
    <p>May the almighty bless you with everything that your heart desires. (Say Ameen) 🎈</p>
    <p>Love you to the moon and back... Pappii duu???</p>
    <p>Can't wait to make you breathlessss</p>
  </div>

  <!-- Floating Hearts and Kisses -->
  <div class="hearts-container"></div>

  <script>
    // Function to create floating hearts and kisses
    function createFloatingElements() {
      const container = document.querySelector('.hearts-container');
      const heartCount = 25; // Number of hearts
      const kissCount = 25; // Number of kisses

      // Create hearts
      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = `${Math.random() * 100}vw`; // Random horizontal position
        heart.style.animationDuration = `${Math.random() * 3 + 2}s`; // Random speed
        heart.style.fontSize = `${Math.random() * 2 + 1}rem`; // Random size
        container.appendChild(heart);
      }

      // Create kisses
      for (let i = 0; i < kissCount; i++) {
        const kiss = document.createElement('div');
        kiss.className = 'kiss';
        kiss.innerHTML = '💋';
        kiss.style.left = `${Math.random() * 100}vw`; // Random horizontal position
        kiss.style.animationDuration = `${Math.random() * 3 + 2}s`; // Random speed
        kiss.style.fontSize = `${Math.random() * 2 + 1}rem`; // Random size
        container.appendChild(kiss);
      }
    }

    // Call the function to create floating elements
    createFloatingElements();
  </script>
</body>
</html>
